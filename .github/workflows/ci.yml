name: Project 35 quality checks

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest --cov=project35 --cov-report=term-missing
      - run: python django_app/manage.py check
      - run: docker compose config --quiet
