[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "project35-mlops"
version = "0.1.0"
description = "Phase 1 data foundation and continuously tested development API for Project 35"
requires-python = ">=3.11,<3.12"
dependencies = ["fastapi>=0.115,<1.0", "uvicorn[standard]>=0.30,<1.0", "Django>=5.1,<5.3", "djangorestframework>=3.15,<4.0", "drf-spectacular>=0.28,<1.0", "pydantic>=2.8,<3.0", "pandas>=2.2,<3.0", "scikit-learn>=1.5,<2.0", "PyYAML>=6.0,<7.0", "mlflow>=3.0,<4.0", "matplotlib>=3.9,<4.0", "shap>=0.46,<1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9.0", "pytest-django>=4.9,<5.0", "httpx>=0.27,<1.0", "pytest-cov>=5.0,<7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "django_app"]
addopts = "-ra --strict-markers"
DJANGO_SETTINGS_MODULE = "config.settings"

[tool.coverage.run]
branch = true
source = ["project35"]

[tool.coverage.report]
show_missing = true
skip_covered = true
